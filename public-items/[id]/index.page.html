<!--
  title: Item
  description: A single inventory item, to read or, with permission, to edit
-->
<page template="default" title="Item">
<content>
	<div id="app" class="container py" hidden>
		<k-tabs active="details" hash-routing>
			<k-tab for="details">Details</k-tab>
			<k-tab-content name="details" class="pt">
				<div id="itemHeader"></div>
				<div id="itemBody"></div>
			</k-tab-content>
			<k-tab for="quantity">Quantity</k-tab>
			<k-tab-content name="quantity" class="pt">
				<k-inventory-item-quantity id="itemQuantity"></k-inventory-item-quantity>
			</k-tab-content>
			<location name="inventory-item-tabs" />
		</k-tabs>
	</div>
</content>
<content location="scripts">
	<script type="module" src="/kempo-ui/components/Tabs.js"></script>
	<script type="module">
		import { html, render } from '/kempo-ui/lit-all.min.js';
		import Dialog from '/kempo-ui/components/Dialog.js';
		import Toast from '/kempo-ui/components/Toast.js';
		import { getSession, getAllCurrentUserPermissions } from '/kempo/sdk.js';
		import { getItem, deleteItem, getFields } from '/inventory/sdk.js';
		import { createItemForm } from '/inventory/components/ItemForm.js';
		import '/inventory/components/ItemQuantity.js';

		/*
		  One page for an item, the same for everyone: Details, Quantity and whatever extensions add to the
		  inventory-item-tabs location (Barcodes, say). Details is the item form: editable for people who may
		  update items, the same form with every box read only for everyone else.
		*/
		const id = location.pathname.split('/').filter(Boolean).pop();
		const $app = document.getElementById('app');
		const $header = document.getElementById('itemHeader');
		const $body = document.getElementById('itemBody');

		const [, session] = await getSession();
		const [, permissionData] = session?.user ? await getAllCurrentUserPermissions() : [null, null];
		const permissions = new Set(permissionData?.permissions ?? []);
		const can = name => permissions.has(`kempo-inventory:${name}`);
		const canEdit = can('items:update');

		/* Everyone sees the count and its history; only people who may adjust it get the form (the component checks). */
		document.getElementById('itemQuantity').itemId = id;

		let fields = [];
		let current = null;
		let form = null;
		let dirty = false;
		let saving = false;

		const [fieldsError, fieldData] = await getFields();
		if(fieldsError){
			$app.innerHTML = '<p class="tc-danger">You need to sign in to view this item.</p>';
			$app.hidden = false;
			Toast.error(fieldsError.msg || 'Failed to load the inventory fields');
		} else {
			fields = fieldData.fields;
			$app.hidden = false;
			$body.style.maxWidth = '44rem';
			await show();
		}

		/* The category is a built-in property of every item; '' means uncategorised. */
		function categoryOf(item){ return (item.category ?? '').trim(); }
		function categoryHref(name){ return name ? `/category?name=${encodeURIComponent(name)}` : '/category?uncategorised=1'; }
		function tagChips(tags){ return tags?.length ? html`<div class="tag-list">${tags.map(tag => html`<a class="tag-chip" href="/search?tag=${encodeURIComponent(tag)}">${tag}</a>`)}</div>` : ''; }

		/* Loads the item and draws the page from it: the first time, and again after a save. */
		async function show(){
			const [error, data] = await getItem(id);
			if(error){
				render(html`<a href="/" class="btn mb"><k-icon name="arrow" direction="left"></k-icon> Home</a>
					<h1>${error.code === 404 ? 'Item not found' : 'Something went wrong'}</h1><p>${error.msg}</p>`, $header);
				return;
			}
			current = data;
			document.title = `${data.item.name} · Inventory`;
			dirty = false;
			mountForm();
			drawHeader();
		}

		/* The form is a fresh one each time: that is what Reset does, and what a save leaves behind. */
		function mountForm(){
			const { item, linked, media } = current;
			form = createItemForm({ item, fields, readOnly: !canEdit, context: { linked, media, ownId: item.id } });
			$body.replaceChildren(form.$root);
		}

		function drawHeader(){
			if(!current) return;
			const { item } = current;
			const category = categoryOf(item);
			const backHref = category ? categoryHref(category) : '/';
			render(html`
				<div class="d-f" style="align-items: center;">
					<a href=${backHref} class="btn mb mrq" id="backBtn"><k-icon name="arrow" direction="left"></k-icon> ${category || 'Home'}</a>
					<div class="flex"></div>
					${canEdit ? html`
						<button type="button" class="btn mb mrq" id="resetBtn" ?disabled=${!dirty || saving} @click=${reset}>Reset</button>
						<button type="button" class="btn success mb mrq" id="saveBtn" ?disabled=${!dirty || saving} @click=${save}>${saving ? 'Saving…' : 'Save'}</button>` : ''}
					${can('items:delete') ? html`<button type="button" class="btn danger mb" id="deleteBtn" @click=${remove}><k-icon name="delete"></k-icon> Delete</button>` : ''}
				</div>
				<h1 class="mb" id="itemName">${item.name}</h1>
			`, $header);
		}

		function reset(){
			mountForm();
			dirty = false;
			drawHeader();
		}

		async function save(){
			if(saving || !form) return;
			saving = true;
			drawHeader();
			const saved = await form.save();
			saving = false;
			if(!saved){
				drawHeader();
				return;
			}
			Toast.success(`Saved ${saved.name}`, { position: 'bottom right' });
			await show();
		}

		function remove(){
			const { item } = current;
			const category = categoryOf(item);
			Dialog.confirm(`Delete "${item.name}" and its stock history? This action cannot be undone.`, async confirmed => {
				if(!confirmed) return;
				const [deleteError] = await deleteItem(item.id);
				if(deleteError){
					Toast.error(deleteError.msg || 'Failed to delete item');
					return;
				}
				location.href = category ? categoryHref(category) : '/';
			});
		}

		/* Save and Reset wake up when anything in the form differs from how it opened. Some boxes keep their value inside their own shadow DOM, so this checks on a short timer too. */
		function checkDirty(){
			const next = Boolean(form?.isDirty());
			if(next === dirty) return;
			dirty = next;
			drawHeader();
		}
		if(canEdit){
			$body.addEventListener('input', () => setTimeout(checkDirty));
			$body.addEventListener('change', () => setTimeout(checkDirty));
			setInterval(checkDirty, 400);
			/* The browser's own "Leave site?" prompt while there are unsaved changes. */
			window.addEventListener('beforeunload', event => {
				if(!dirty) return;
				event.preventDefault();
				event.returnValue = '';
			});
			window.hasUnsavedInventoryWork = () => dirty;
		}
	</script>
</content>
</page>
