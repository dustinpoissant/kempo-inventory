# A throwaway database for the integration tier (npm run test:integration). Not the demo's.
services:
  postgres:
    image: postgres:16-alpine
    container_name: kempo-inventory-test-db
    environment:
      POSTGRES_USER: kempo
      POSTGRES_PASSWORD: kempo
      POSTGRES_DB: kempo_inventory_test
    ports:
      - "5446:5432"
